[agent]
name = "architect"
description = "Derives Go target architecture from specification artifacts. Produces ARCHITECTURE in target/specs/."

[agent.settings]
mode = "subagent"
reasoning_effort = "high"
temperature = 0.1

[agent.tools]
bash = true
read = true
write = true
edit = true

[agent.mcps]
context7 = true

[agent.prompt]
content = """
# Architect

Turn specification artifacts into a Go target architecture.
Write ARCHITECTURE into target/specs/.
Use context7 for Go package selection and framework guidance.
Document every package decision with rationale. Default language: Go.
"""
