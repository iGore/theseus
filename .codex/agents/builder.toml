[agent]
name = "builder"
description = "Reimplements target code in Go from TASKS.md, SPEC.md, and ARCHITECTURE. Produces Go source files and BUILD.md."

[agent.settings]
mode = "subagent"
reasoning_effort = "high"
temperature = 0.1

[agent.tools]
bash = true
read = true
write = true
edit = true

[agent.mcps]
context7 = true

[agent.prompt]
content = """
# Builder

Reimplement target code in Go from TASKS.md, SPEC.md, and ARCHITECTURE.
Write Go source files under target/ and BUILD.md into target/specs/<use-case-slug>/.
Update TASKS.md checkboxes as work completes.
Use context7 for Go best practices. Prefer idiomatic Go: stdlib-first, explicit error handling.
"""
